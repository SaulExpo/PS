<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio</title>
  <link rel="stylesheet" href="../Styles/header.css">
  <link rel="stylesheet" href="../Styles/footer.css">
  <link rel="stylesheet" href="../Styles/exercise_detail.css">
  <script type="module" src="../JavaScript/firebase_config.js"></script>
  <script type="module" src="../JavaScript/Excercises/exercise_detail.js"></script>
  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
</head>
<body>
<header id="main_header"></header>

<main>
  <h1 id="exercise-name">Loading exercise...</h1>
  <img id="exercise-image" src="" alt="Imagen del ejercicio">
  <p id="body-part"></p>
  <p id="equipment"></p>
  <p id="target"></p>
  <p id="secondary-muscles"></p>

  <h2 id="InstructionsLabel">Instructions</h2>
  <ol id="instructions"></ol>
</main>

<footer id="main_footer"></footer>

<script type="module">
  import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
  loadTemplate("../Templates/header.html", "main_header");
  loadTemplate("../Templates/footer.html", "main_footer");

  document.addEventListener("DOMContentLoaded", () => {
    loadHeader();
    loadFooter();
  });

</script>
</body>

</html>
