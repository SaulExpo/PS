<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creatina</title>

  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/creatina.css" />

  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js" defer></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js" defer></script>
  <script type="module" src="/PS-FitPlanner/JavaScript/Shop/creatina.js" defer></script>
</head>
<body>

<header id="main_header"></header>

<main>
  <section class="cabecera-creatina">
    <div class="contenedor-cabecera">
      <h1>Nuestra mejor selección de Creatina</h1>
      <p>
        La creatina es uno de los suplementos más investigados y efectivos para mejorar el rendimiento físico,
        aumentar la fuerza y apoyar el crecimiento muscular. Descubre nuestra selección para llevar tu entrenamiento al siguiente nivel.
      </p>
    </div>
  </section>

  <section class="productos-container" id="productos-container">

  </section>
</main>

<footer id="main_footer"></footer>

<script type="module">
  import { loadTemplate, loadHeader } from "../JavaScript/GlobalLoad/loadHeader.js";

  Promise.all([
    loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")
  ]).then(() => {
    loadHeader();
    loadFooter();
  });
</script>

</body>
</html>
