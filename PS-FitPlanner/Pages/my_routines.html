<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mis Rutinas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../Styles/header.css" />
  <link rel="stylesheet" href="../Styles/footer.css" />
  <link rel="stylesheet" href="../Styles/my_routines.css" />
  <script src="../JavaScript/loadHeader.js"></script>
  <script src="../JavaScript/loadFooter.js"></script>
  <script src="../JavaScript/script.js"></script>
</head>
<body>

<!-- Header -->
<div id="main_header"></div>

<main class="container">
  <h1><strong>Mis Rutinas</strong></h1>

  <!-- Botón para crear nueva rutina -->
  <button class="new-btn" onclick="window.location.href='exercise_selector.html'">
    Crear Nueva Rutina
  </button>

  <!-- Contenedor para la lista de rutinas -->
  <div id="routine-list" class="routine-list">
    <!-- JS cargará aquí las rutinas -->
  </div>
</main>

<!-- Footer -->
<div id="main_footer"></div>

<!-- Cargar header y footer -->
<script>
  Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
    loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
  {
    loadHeader()
    loadFooter()
  })
</script>

<!-- Script para cargar las rutinas -->
<script src="../JavaScript/my_routines.js"></script>
</body>
</html>
