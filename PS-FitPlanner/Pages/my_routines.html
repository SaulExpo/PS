<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mis Rutinas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../Styles/header.css" />
  <link rel="stylesheet" href="../Styles/footer.css" />
  <link rel="stylesheet" href="../Styles/my_routines.css" />
  <script src="../JavaScript/script.js"></script>
  <script src="../JavaScript/firebase_config.js"></script>
  <script type="module" src="../JavaScript/Excersices/my_routines.js"></script>
  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
</head>
<body>


<div id="main_header"></div>

<main class="container">
  <h1><strong>My routines</strong></h1>

  <button class="new-btn" onclick="window.location.href='exercise_selector.html'">
    Create new routine
  </button>

  <div id="routine-list" class="routine-list">
  </div>
</main>

<div id="main_footer"></div>


<script type="module">
  import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
  Promise.all([loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")]
  ).then(() => {
    loadHeader()
    loadFooter()
  })
</script>
</body>
</html>
