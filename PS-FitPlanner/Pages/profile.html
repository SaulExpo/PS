<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../Styles/profile.css" rel=stylesheet>
    <link href="../Styles/footer.css" rel=stylesheet>
    <link href="../Styles/header.css" rel=stylesheet>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/asignacion_prof.js"></script>
    <script type="module" src="../JavaScript/Profile/profile.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <title>Profile</title>

</head>
<body>
<header id="main_header">
</header>

<main>
    <div id="calificacion">

    </div>
    <div id="buttons_and_rectangle">
        <div id="buttons_profile">
            <ul>
                <li>
                    <button class="button_profile" onclick="location.replace('main_page.html')">
                        <img id="home" src="../Resources/home.png" >
                        <span id="HomeLabel">Home</span>
                    </button>
                    <button class="button_profile" onclick="location.replace('graphic.html')">
                        <img id="graphic" src="../Resources/graphic.png" >
                        <span id="GraphLabel">Graphics</span>
                    </button>
                    <button class="button_profile" onclick="location.replace('select_payment_plan.html')">
                        <img src="../Resources/suscription.png" id="suscription" alt="foto perfil" >
                        <span id="SuscriptionLabel">Suscription</span>
                    </button>
                    <button class="button_profile" onclick="location.replace('./edit_profile.html')">
                        <img src="../Resources/edit.jpg" id="editProfile" alt="foto perfil" >
                        <span id="EditLabel">Edit Profile</span>
                    </button>
                </li>
            </ul>
        </div>
        <div>
            <div id="avatar_profile">
                <img id="icon" alt="Name">
                <h1 id="name_avatar"></h1>
            </div>
            <div class="rectangle">
            </div>
        </div>

    </div>

    <div id="alumn_view">
        <div>
            <h1 class="titulo" id="Assigned">Assigned Professional</h1>
            <section id="profe_asig">
            </section>
            <section id="cambio_view">
                <h1 class="titulo" id="Change">Do you want to change your professional?</h1>
                <section id="cambio_profe">
                    <p id="ChangeP">If you want to change the professional for any reason, click on the button</p>
                    <button id="ChangeButton" class="button_user_action" onclick="verProfes()">Change</button>
                </section>
                <section id="profes_info">
                    <h1 id="Available">Available Professionals</h1>
                    <ul id="profe_list">
                    </ul>
                    <button id="Cancel" class="button_user_action" onclick="cancelarCambio()">Cancel</button>
                </section>

            </section>
        </div>
        <div id="objetivos_view">
            <h1 id="objectives" class="titulo">Objetivos</h1>
            <p id="oLabel">Ponte nuevos objetivos para  alcanzar el siguiente nivel</p>
            <select id="objetivos">
                <option id="ooption" disabled selected value="">¿Cual sera el proximo objetivo?</option>
                <option id="o1" value="0">Pérdida de peso</option>
                <option id="o2" value="1">Tren superior</option>
                <option id="o3" value="2">Tren inferior</option>
                <option id="o4" value="3">LLegar a nivel intermedio</option>
                <option id="o5" value="4">LLegar a nivel avanzado</option>
            </select>
            <button id="confirm" type="button" class="button_user_action" onclick="seleccionarObjetivo()">Confirmar</button>
        </div>

    </div>

    <div id="profe_view">
        <h1 id="Student" class="titulo">Student's List</h1>
        <div id="alumnos_info">
            <h2 id="alumnos"></h2>
            <ul id="alum-list">
            </ul>
        </div>

    </div>


</main>

<footer id="main_footer">
</footer>

</body>
</html>
