<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../Styles/profile.css" rel=stylesheet>
    <link href="../Styles/footer.css" rel=stylesheet>
    <link href="../Styles/header.css" rel=stylesheet>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/asignacion_prof.js"></script>
    <script type="module" src="../JavaScript/Profile/profile.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
    <title>Profile</title>

</head>
<body>
<header id="main_header">
</header>

<main>


    <div id="buttons_and_rectangle">
        <div id="buttons_profile">
            <ul>
                <li>
                    <button class="button_profile" onclick="location.replace('main_page.html')">
                        <img id="home" src="../Resources/home.png" >
                        Home
                    </button>
                    <button class="button_profile" onclick="location.replace('graphic.html')">
                        <img id="graphic" src="../Resources/graphic.png" >
                        Graficas
                    </button>
                    <button class="button_profile" onclick="location.replace('select_payment_plan.html')">
                        <img src="../Resources/suscription.png" id="suscription" alt="foto perfil" >
                        Suscripcion
                    </button>
                </li>
            </ul>
        </div>
        <div>
            <div id="avatar_profile">
                <img id="icon" alt="Name">
                <h1 id="name_avatar"></h1>
            </div>
            <div class="rectangle">
            </div>
        </div>

    </div>

    <div id="alumn_view">
        <h1 class="titulo">Profesional asignado</h1>
        <section id="profe_asig">
        </section>
        <section id="cambio_view">
            <h1 class="titulo">¿Deseas cambiar de profesional?</h1>
            <section id="cambio_profe">
                <p>Si deseas cambiar de profesional por algún motivo pulse el siguiente boton</p>
                <button class="button_user_action" onclick="verProfes()">Cambiar</button>
            </section>
            <section id="profes_info">
                <h1>Profesionales disponibles</h1>
                <ul id="profe_list">

                </ul>
                <button class="button_user_action" onclick="cancelarCambio()">Cancelar</button>
            </section>

        </section>
    </div>

    <div id="profe_view">
        <h1 class="titulo">Lista de alumnos</h1>
        <div id="alumnos_info">
            <h2 id="alumnos"></h2>
            <ul id="alum-list">
            </ul>
        </div>

    </div>
    <button onclick="location.replace('./edit_profile.html')">Editar Perfil</button>

</main>

<footer id="main_footer">
</footer>

</body>
</html>
