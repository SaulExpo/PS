<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../Styles/profile.css" rel=stylesheet>
    <link href="../Styles/footer.css" rel=stylesheet>
    <link href="../Styles/header.css" rel=stylesheet>
    <script src="../JavaScript/loadHeader.js"></script>
    <script src="../JavaScript/loadFooter.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/asignacion_prof.js"></script>
    <script src="../JavaScript/profile.js" type="module"></script>
    <title>Profile</title>

    <script src="/PS-FitPlanner/JavaScript/xlu-include-file.js"></script>
</head>
<body>
<header id="main_header">
</header>

<main>


    <div id="buttons_and_rectangle">
        <div id="buttons_profile">
            <ul>
                <li>
                    <button class="button_profile" onclick="location.replace('main_page.html')">
                        <img id="home" src="../Resources/home.png" >
                        Home
                    </button>
                    <button class="button_profile" onclick="location.replace('graphic.html')">
                        <img id="graphic" src="../Resources/graphic.png" >
                        Graficas
                    </button>
                    <button class="button_profile" onclick="location.replace('select_payment_plan.html')">
                        <img id="suscription" src="../Resources/suscription.png" >
                        Suscripcion
                    </button>
                </li>
            </ul>
        </div>
        <div>
            <div id="avatar_profile">
                <img id="icon" src="../Resources/icono.avif" alt="Name">
                <h1>Name</h1>
            </div>
            <div class="rectangle">

                <table>
                    <tr>
                        <th class="half-left">
                            <div class="part">
                                <label class="tag">Correo</label>
                                <p>noseque@correo.com</p>
                            </div>
                        </th>
                        <th class="half-right">
                            <div class="part">
                                <label class="tag">Sexo</label>
                                <p>Hombre</p>
                            </div>
                        </th>
                    </tr>
                    <tr>
                        <th>
                            <div class="part">
                                <label class="tag">Altura</label>
                                <p>187</p>
                            </div>
                        </th>
                        <th>
                            <div class="part">
                                <label class="tag">Edad</label>
                                <p>22</p>
                            </div>
                        </th>
                    </tr>
                    <tr>
                        <th>
                            <div class="part">
                                <label class="tag">Peso</label>
                                <p>98</p>
                            </div>
                        </th>
                    </tr>
                </table>







            </div>
        </div>

    </div>

    <div id="asignacion">
        <h1>Lista de alumnos</h1>
        <div id="alumnos_info">
            <h2 id="alumnos"></h2>
            <ul id="alum-list">
            </ul>
        </div>

    </div>

</main>

<footer id="main_footer">
</footer>

</body>
</html>
