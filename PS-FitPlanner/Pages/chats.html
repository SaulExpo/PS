<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Privado</title>
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css">
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css">
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/chat.css">
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/chats.css">
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script type="module" src="../JavaScript/GetDB/getUser.js"></script>
    <script type="module" src="../JavaScript/Chat/chats.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>

<header id="main_header"></header>

<main>
<div class="max-w-md mx-auto bg-white shadow-lg rounded-xl p-4 mb-4 space-y-4">

    <div class="flex items-center justify-between gap-2 flex-wrap">
        <button id="cerrados" class="botonesChat">Show Close</button>
        <button id="abiertos" class="botonesChat">Show Open</button>
        <button id="favoritos" class="botonesChat">Show Favourites</button>
        <button id="nofavoritos" class="botonesChat">Show All</button>

        <form action="chat.html">
            <select name="to" id="p_select" class="text-sm border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option selected disabled>Select a professional</option>
            </select>

            <button type="submit" class="botonesChat">
                Start chat
            </button>
        </form>
    </div>

    <!-- Buscador -->
    <input id="buscador" type="text" placeholder="Search chats by name..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"/>
</div>


<div class="max-w-md mx-auto bg-white shadow-lg rounded-xl">
    <h2 class="text-xl font-bold p-4 border-b">Select a chat</h2>
    <ul id="chatSelection" class="divide-y divide-gray-200">
    </ul>
</div>

</main>


<footer id="main_footer"></footer>
</body>
<script type="module">
    import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })
</script>
</html>
