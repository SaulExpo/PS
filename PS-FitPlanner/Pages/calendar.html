<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="../Styles/calendar.css" rel=stylesheet>
  <link href="../Styles/footer.css" rel=stylesheet>
  <link href="../Styles/header.css" rel=stylesheet>
  <script type="module" src="../JavaScript/GetDB/getUser.js"></script>
  <script type="module" src="../JavaScript/calendar.js"></script>
  <script type="module" src="../JavaScript/GetDB/getUserRoutines.js"></script>
  <script type="module" src="../JavaScript/firebase_config.js"></script>
  <script src="../JavaScript/script.js"></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid/main.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
  <title>Calendar</title>

</head>
<body>
<header id="header">
</header>

<main>
  <div id="container">
    <div id='calendar'></div>
  </div>

  <div class="modal fade" id="eventModal" tabindex="-1" role="dialog" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="eventModalLabel">New Event</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="eventForm">
            <div class="form-group">
              <label for="eventDate">Date</label>
              <input type="datetime-local" class="form-control" id="eventDate" required>
            </div>
            <div class="form-group">
              <label for="eventRutine">Routine</label>
              <select class="form-control" id="eventRutine" required>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Create Event</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editEventModal" tabindex="-1" role="dialog" aria-labelledby="editEventModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editEventModalLabel">Edit Event</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="editEventForm">
            <div class="form-group">
              <label for="editEventDate">Date</label>
              <input type="datetime-local" class="form-control" id="editEventDate" required>
            </div>
            <div class="form-group">
              <label for="editEventRutine">Routine</label>
              <select class="form-control" id="editEventRutine" required>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-danger" id="deleteEventButton">Delete Event</button>
          </form>
        </div>
      </div>
    </div>
  </div>





</main>

<footer id="footer">
  <div class="footer_temp">
    <div>
      <section>
        <h2>Logo</h2>
      </section>
      <section>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </section>
      <section>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </section>
      <section>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </section>
    </div>
    <div>
      <nav>
        <a href="#">Dorem Ipsum</a>
        <a href="#">Dorem Ipsum</a>
        <a href="#">Dorem Ipsum</a>
      </nav>
      <div>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</footer>

<script type="module">
  import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
  Promise.all([loadTemplate("../Templates/footer.html", "footer"),
  loadTemplate("../Templates/header.html", "header")]
  ).then(() => {
    loadHeader()
    loadFooter()
  })
</script>
</body>
</html>
