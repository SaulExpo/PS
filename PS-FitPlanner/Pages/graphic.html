<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gráficos</title>

    <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css">
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css">
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/graphic.css">

    <script src="/PS-FitPlanner/JavaScript/xlu-include-file.js"></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="../JavaScript/loadFooter.js"></script>
    <script src="../JavaScript/loadHeader.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script>
        google.charts.load('current', {packages: ['corechart']});
        google.charts.setOnLoadCallback(() => loadData('../JavaScript/calorias.js', 'month'));

        function loadData(filename, range = 'month') {
            fetch(filename)
                .then(response => response.json())
                .then(data => {
                    if (range === 'week') {
                        data = data.slice(-7);
                    }
                    drawChart(data, filename);
                })
                .catch(error => console.error('Error cargando datos:', error));
        }

        function drawChart(dataArray, filename) {
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Day');

            let title, vAxisTitle;

            if (filename === '../JavaScript/calorias.js') {
                data.addColumn('number', 'Calories Burn');
                title = 'Calories Burn per Day';
                vAxisTitle = 'Calories';
                dataArray.forEach(item => {
                    let caloriasQuemadas = calcularCalorias(item.met, item.peso, item.minutos);
                    data.addRow([item.dia, caloriasQuemadas]);
                });
            } else {
                data.addColumn('number', 'Steps');
                title = 'Steps Done per Day';
                vAxisTitle = 'Steps';
                dataArray.forEach(item => {
                    data.addRow([item.dia, item.valor]);
                });
            }

            var options = {
                title: title,
                hAxis: {title: 'Day of the Month'},
                vAxis: {title: vAxisTitle},
                legend: 'none',
                colors: ['#4285F4'],
                tooltip: {
                    isHtml: false,
                    textStyle: {
                        fontSize: 25,
                        bold: false,
                        color: '#333'
                    }
                }
            };

            document.getElementById('chart_div').innerHTML = '';

            var chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }

        function calcularCalorias(met, peso, minutos) {
            return ((met * peso * 3.5) / 200) * minutos;
        }
    </script>
</head>
<body>

<header id="main_header"></header>

<div class="buttons-container">
    <button onclick="loadData('../JavaScript/calorias.js', 'month')">Show Calories</button>
    <button onclick="loadData('../JavaScript/pasos.js', 'month')">Show Steps</button>
</div>

<div id="chart_div" class="chart-container"></div>

<div class="buttons-container">
    <button onclick="loadData('../JavaScript/calorias.js', 'week')">Semana - Calorías</button>
    <button onclick="loadData('../JavaScript/pasos.js', 'week')">Semana - Pasos</button>
</div>


<footer id="main_footer"></footer>

<script>
    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })
</script>

</body>
</html>
