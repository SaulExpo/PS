<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../Styles/profile.css" rel=stylesheet>
    <link href="../Styles/edit_profile.css" rel=stylesheet>
    <link href="../Styles/footer.css" rel=stylesheet>
    <link href="../Styles/header.css" rel=stylesheet>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script type="module" src="../JavaScript/GetDB/getUser.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
    <script src="../JavaScript/asignacion_prof.js"></script>
    <script type="module" src="../JavaScript/Profile/edit_profile.js"></script>

    <title>Profile</title>

</head>
<body>
<header id="main_header">
</header>

<main>
    <div>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="editProfileName" id="name">Nombre</label>
                <input type="text" class="form-control" id="editProfileName" required minlength="6">
            </div>
            <div class="form-group">
                <label for="editProfileSurname" id="surname">Apellido</label>
                <input type="text" class="form-control" id="editProfileSurname" required minlength="6">
            </div>
            <div class="form-group">
                <label for="editProfileEdad" id="age">Edad</label>
                <input type="number" class="form-control" id="editProfileEdad" required min="0">
            </div>
            <div class="form-group">
                <label for="editProfileAltura" id="height">Altura</label>
                <input type="number" class="form-control" id="editProfileAltura" required min="0">
            </div>
            <div class="form-group">
                <label for="editProfilePeso" id="weight">Peso</label>
                <input type="number" class="form-control" id="editProfilePeso" required min="0">
            </div>
            <div class="form-group">
                <label id="sex">Genero</label>
                <select id="editProfileGenero">
                    <option selected disabled value="" id="select">Selecciona el genero</option>
                    <option value="Hombre" id="male">Hombre</option>
                    <option value="Mujer" id="female">Mujer</option>
                </select>
            </div>
            <div id="buttons">
                <button class="button" type="submit" id="save">Guardar Cambios</button>
                <button onclick=location.href="../Pages/profile.html" class="button" type="button" id="cancel">Cancelar Cambios</button>
            </div>

        </form>
    </div>

</main>

<footer id="main_footer">
</footer>

<script type="module">
    import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })
</script>
</body>
</html>
