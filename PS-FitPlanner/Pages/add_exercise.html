<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add_exercise</title>
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/footer.css">
    <link rel="stylesheet" href="../Styles/add_exercise.css">
    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
</head>
<body>

<header id="main_header">
</header>

<main>
    <div class="exercise-title">Exercise name</div>
    <div class="description-box">DESCRIPTION</div>
    <div class="buttons">
        <button class="cancel-btn">Cancel</button>
        <button class="save-btn">Save</button>
    </div>
</main>


<footer id="main_footer">
</footer>

<script type="module">
    import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
    Promise.all([loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")]
    ).then(() => {
        loadHeader()
        loadFooter()
    })
</script>


</body>
</html>
