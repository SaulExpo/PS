<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rutina</title>
  <script src="../JavaScript/script.js" defer></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js" defer></script>
  <script src="../JavaScript/GlobalLoad/loadHeader.js" defer></script>
  <script type="module" src="../JavaScript/firebase_config.js"></script>
  <script type="module" src="../JavaScript/Excercises/routinesreader.js"></script>
  <link type="module" rel="stylesheet" href="../Styles/header.css">
  <link rel="stylesheet" href="../Styles/footer.css">
  <link rel="stylesheet" href="../Styles/info_exercise.css">
  <link rel="stylesheet" href="../Styles/rutine.css">
</head>
<body>
<div class="page-wrapper">
  <header id="main_header"></header>

  <section id="selectors">
    <div class="horizontal-selectors">
      <label for="typeSelector" id="prueba">Routine type:</label>
      <select id="typeSelector">
        <option id="option1" disabled selected>Select type</option>
      </select>

      <label for="routineSelector" id="routine">Routine:</label>
      <select id="routineSelector" disabled>
        <option id="option2" disabled selected>Select routine</option>
      </select>
    </div>

    <div class="search-bar">
      <label for="globalSearch" id="search">Search routine (global):</label>
      <input type="text" id="globalSearch" placeholder="Ej. push beginner, core, etc." />
      <select id="searchResults">
        <option id="option3" disabled selected>Results will appear here</option>
      </select>
    </div>
  </section>

  <main>
    <h2 id="title">Routine</h2>
    <p id="info">Select your routine to see the exercises</p>
    <div id="durationContainer">
      <p><strong id="duration">Duration:</strong>
    </div>
    <div id="restContainer">
      <p><strong id="rest">Rest during sets:</strong>
    </div>
    <div id="exercises"></div>
  </main>

  <footer id="main_footer"></footer>
</div>

<script type="module">
  import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
  setTimeout(() => {
    loadHeader();
    loadFooter();
  }, 50);
</script>
</body>
</html>
