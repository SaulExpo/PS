<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rutina</title>
  <script src="../JavaScript/script.js" defer></script>
  <script src="../JavaScript/loadFooter.js"></script>
  <script src="../JavaScript/loadHeader.js"></script>
  <link rel="stylesheet" href="../Styles/header.css">
  <link rel="stylesheet" href="../Styles/footer.css">
  <link rel="stylesheet" href="../Styles/info_exercise.css">
  <link rel="stylesheet" href="../Styles/rutine.css">
</head>
<body>
<header id="main_header"></header>

<section id="selectors">
  <div class="horizontal-selectors">
    <label for="typeSelector">Routine type:</label>
    <select id="typeSelector">
      <option disabled selected>Select type</option>
    </select>

    <label for="routineSelector">Routine:</label>
    <select id="routineSelector" disabled>
      <option disabled selected>Select routine</option>
    </select>
  </div>

  <div class="search-bar">
    <label for="globalSearch">Search routine (global):</label>
    <input type="text" id="globalSearch" placeholder="Ej. push beginner, core, etc." />
    <select id="searchResults">
      <option disabled selected>Results will appear here</option>
    </select>
  </div>
</section>

<main>
  <h2 id="title">Routine</h2>
  <p id="info">Select your routine to see the exercises</p>
  <div id="durationContainer">
    <p><strong>Duration:</strong>
  </div>
  <div id="exercises"></div>
</main>

<footer id="main_footer"></footer>

<script>
  setTimeout(() => {
    loadHeader()
    loadFooter()
          },500)
</script>

</body>
<script>
  Promise.all([loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")]
  ).then(() => {
    loadHeader()
    loadFooter()
  })
</script>
</html>
