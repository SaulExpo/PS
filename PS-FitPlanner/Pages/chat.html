<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda</title>

  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/chat.css">
  <script src="../JavaScript/loadFooter.js"></script>
  <script src="../JavaScript/loadHeader.js"></script>
  <script src="../JavaScript/script.js"></script>


  <script src="/PS-FitPlanner/JavaScript/xlu-include-file.js"></script>
</head>
<body>

<header xlu-include-file="/PS-FitPlanner/Templates/header.html"></header>


<main>

  <div class="container">
    <div class="rectangle">
      <div class="rectangle1">
        <p>Lorem Ipsum</p>
      </div>
      <div class="rectangle2">
        <img id="icon" src="/PS-FitPlanner/Resources/icon.png" alt="icon">
        <p>Lorem</p>
      </div>
    </div>

    <div class="chat">
      <div class="chat1">
        <img id="icon1" src="/PS-FitPlanner/Resources/icon.png" alt="icon">
        <p>Lorem</p>
      </div>
      <div class="messages">
        <div id="chatbox"></div>
        <form name="message" action="">
          <input name="usermsg" type="text" id="usermsg" size="60" />
          <input name="submitmsg" type="submit"  id="submitmsg" value="Send" />
        </form>
      </div>
    </div>
  </div>



</main>

<footer xlu-include-file="/PS-FitPlanner/Templates/footer.html"></footer>

<script>
  xLuIncludeFile().then(() =>
  {
    loadHeader()
    loadFooter()
  })()</script>

</body>
</html>
