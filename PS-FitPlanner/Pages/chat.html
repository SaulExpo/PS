<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat Privado</title>
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/chat.css">
  <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
  <script type="module" src="../JavaScript/GetDB/getUser.js"></script>
  <script src="../JavaScript/script.js"></script>
  <script type="module" src="../JavaScript/firebase_config.js"></script>
  <script type="module" src="../JavaScript/Chat/chat.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>
<body>
<header id="main_header"></header>


<main>
<h2 id="privateChat">Private Chat</h2>

<div id="chatbox"></div>
  <div id="chat_submit">
    <div id="input-container">
      <input type="text" id="usermsg" placeholder="Send a message..." />
      <button id="send">Send</button>
    </div>
    <div class="upload-wrapper">
      <label for="imageInput" class="upload-icon">
        <i class="fas fa-camera"></i>
        <img id="preview" class="image-preview" src="" alt="Preview">
      </label>
      <input id="imageInput" type="file" accept="image/*" style="display: none;">
    </div>
  </div>
</main>

<footer id="main_footer"></footer>
<script type="module">
  import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
  Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
    loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
  {
    loadHeader()
    loadFooter()
  })
</script>
</body>
</html>
