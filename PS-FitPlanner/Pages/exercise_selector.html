<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Selector de Ejercicios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/header.css" />
    <link rel="stylesheet" href="../Styles/footer.css" />
    <link rel="stylesheet" href="../Styles/exercise_selector.css" />
    <script src="../JavaScript/script.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
    <script type="module" src="../JavaScript/Excercises/routine_selector.js"></script>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
</head>
<body>

<div id="main_header"></div>

<main class="container">
    <h1 id="selector">Exercise selector</h1>

    <div class="controls">
        <label for="bodypart-select" id="mgroup">Select muscular group:</label>
        <select id="bodypart-select">
            <option id="option" value="" disabled selected>Choose by group</option>
        </select>

        <label for="exercise-search" id="search">Search exercises:</label>
        <div class="search-wrapper">
            <input
                    id="exercise-search"
                    type="search"
                    placeholder="Name, target or equipment…"
            />
        </div>
    </div>

    <div class="routine-controls">
        <input type="text" id="routine-name" placeholder="Routine name" />
        <input type="text" id="routine-duration" placeholder="Duration (example: 1h 0min)" />
        <input type="text" id="routine-rest" placeholder="Rest-time (example: 3:00 min)" />
        <textarea id="routine-description" placeholder="Routine description" rows="3" style="width: 100%; max-width: 400px; border-radius: 8px; border: 1px solid #ccc; padding: 0.6rem;"></textarea>

        <button id="save-export-routine" class="export-btn">Save routine</button>
    </div>
    <div id="selected-summary"></div>

    <div id="exercise-list"></div>
</main>

<div id="main_footer"></div>

<script>
    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })
</script>
<script type="module">
    import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";
    Promise.all([loadTemplate("../Templates/header.html", "main_header"),
        loadTemplate("../Templates/footer.html", "main_footer")]
    ).then(() => {
        loadHeader()
        loadFooter()
    })
</script>
</body>
</html>
