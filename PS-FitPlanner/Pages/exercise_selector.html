<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Exercise selector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/header.css" />
    <link rel="stylesheet" href="../Styles/footer.css" />
    <link rel="stylesheet" href="../Styles/exercise_selector.css" />
    <script type="module" src="../Firebase/firebase-init.js"></script>
    <script type="module" src="../Firebase/routine_selector.js"></script>
    <script src="../JavaScript/loadHeader.js"></script>
    <script src="../JavaScript/loadFooter.js"></script>
</head>
<body>

<!-- Header -->
<div id="main_header"></div>

<main class="container">
    <h1>Exercise selector</h1>

    <!-- Filtro -->
    <div class="controls">
        <label for="bodypart-select">Select muscular group:</label>
        <select id="bodypart-select">
            <option value="" disabled selected>Choose by group</option>
        </select>

        <label for="exercise-search">Buscar ejercicio:</label>
        <input
                id="exercise-search"
                type="search"
                placeholder="Nombre, target o equipamiento…"
        />
    </div>

    <!-- Nombre, duración, descripción y botón único -->
    <div class="routine-controls">
        <input type="text" id="routine-name" placeholder="Routine name" />
        <input type="text" id="routine-duration" placeholder="Duration (example: 1h 0min)" />
        <input type="text" id="routine-rest" placeholder="Rest-time (example: 3:00 min)" />
        <textarea id="routine-description" placeholder="Routine description" rows="3" style="width: 100%; max-width: 400px; border-radius: 8px; border: 1px solid #ccc; padding: 0.6rem;"></textarea>

        <button id="save-export-routine" class="export-btn">Save routine</button>
    </div>

    <div id="exercise-list"></div>
</main>

<!-- Footer -->
<div id="main_footer"></div>

<script>
    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })
</script>
<script>
    Promise.all([loadTemplate("../Templates/header.html", "main_header"),
        loadTemplate("../Templates/footer.html", "main_footer")]
    ).then(() => {
        loadHeader()
        loadFooter()
    })
</script>
</body>
</html>
