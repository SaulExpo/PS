<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recomendaciones Profesionales</title>

    <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css" />
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css" />
    <link rel="stylesheet" href="/PS-FitPlanner/Styles/recomendaciones.css" />

    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js" defer></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js" defer></script>
    <script type="module" src="/PS-FitPlanner/JavaScript/Shop/recomendaciones.js" defer></script>
</head>
<body>

<header id="main_header"></header>

<main>
    <!-- CABECERA -->
    <section class="cabecera-recomendaciones">
        <div class="contenedor-cabecera">
            <h1>Recomendaciones de Nuestros Profesionales</h1>
            <p>
                Descubre productos seleccionados directamente por entrenadores y profesionales del fitness.
            </p>
            <!-- FILTRO -->
            <div class="filtro-container">
                <label for="filtro-tipo">Filtrar por categoría:</label>
                <select id="filtro-tipo">
                    <option value="todos">Mostrar todos</option>
                    <option value="Proteína">Proteína</option>
                    <option value="Creatina">Creatina</option>
                    <option value="Suplementos">Suplementos</option>
                    <option value="Material Deportivo">Material Deportivo</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
        </div>
    </section>

    <!-- PRODUCTOS -->
    <section class="productos-container" id="productos-container">
        <!-- Cargados dinámicamente desde Firestore -->
    </section>

    <!-- FORMULARIO (solo profesionales) -->
    <section id="formulario-container" style="display: none; padding: 40px;">
        <h2>Publicar nueva recomendación</h2>
        <form id="form-recomendacion">
            <input type="text" id="nombre" placeholder="Nombre del producto" required />
            <input type="url" id="enlace" placeholder="Enlace al producto" required />
            <input type="url" id="imagen" placeholder="URL de la imagen del producto" required />
            <textarea id="descripcion" placeholder="Descripción del producto" required></textarea>

            <label for="tipo">Categoría del producto:</label>
            <select id="tipo" required>
                <option value="">Selecciona una categoría</option>
                <option value="Proteína">Proteína</option>
                <option value="Creatina">Creatina</option>
                <option value="Suplementos">Suplementos</option>
                <option value="Material Deportivo">Material Deportivo</option>
                <option value="Otros">Otros</option>
            </select>

            <button type="submit">Publicar</button>
        </form>
    </section>
</main>

<footer id="main_footer"></footer>

<script type="module">
    import { loadTemplate, loadHeader } from "../JavaScript/GlobalLoad/loadHeader.js";

    Promise.all([
        loadTemplate("../Templates/header.html", "main_header"),
        loadTemplate("../Templates/footer.html", "main_footer")
    ]).then(() => {
        loadHeader();
        loadFooter();
    });
</script>

</body>
</html>
