<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Login</title>
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/footer.css">
    <link rel="stylesheet" href="../Styles/login.css">
    <link rel="stylesheet" href="../Styles/register.css">
    <script type="module" src="../JavaScript/Autenticacion/login.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/script.js"></script>
    <script type="module" src="../JavaScript/firebase_config.js"></script>
</head>
<body>

<header id="main_header">
</header>

<main id="main_login" >
    <div class="wrapper">
        <h2>Login Form</h2>
        <form id="login-form" action="#">
            <div class="input-box">
                <input id="email" type="text" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input id="password" type="password" placeholder="Password" required>
            </div><div class="input-box">
                <a href="forgot_password.html">I forgot the password</a>
            </div>
            <div class="input-box">
                <input type="submit" value="Log in">
            </div>
        </form>
    </div>
</main>

<footer id="main_footer">
</footer>

<script type="module">
    import {loadTemplate, loadHeader} from "../JavaScript/GlobalLoad/loadHeader.js";

    Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
        loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
    {
        loadHeader()
        loadFooter()
    })

</script>


</body>
</html>
