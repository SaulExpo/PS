

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>ResetPassword</title>
  <link rel="stylesheet" href="../Styles/header.css">
  <link rel="stylesheet" href="../Styles/footer.css">
  <link rel="stylesheet" href="../Styles/login.css">
  <link rel="stylesheet" href="../Styles/register.css">
  <script src="../JavaScript/xlu-include-file.js"></script>
  <script src="../JavaScript/resetPassword.js"></script>
  <script src="../JavaScript/script.js"></script>
  <script src="../JavaScript/loadHeader.js"></script>
  <script src="../JavaScript/loadFooter.js"></script>
</head>
<body>

<header id="main_header">
</header>

<main id="main_login" >
  <div class="wrapper">
    <h2>Reset your password</h2>
    <form id="reset-password-form">
      <div class="input-box">
        <input id="new-password" type="password" placeholder="New password" required>
      </div>
      <div class="input-box">
        <input id="confirm-password" type="password" placeholder="Repeat password" required>
      </div>
      <div class="input-box">
        <input type="submit" value="Change Password">
      </div>
    </form>
  </div>
</main>

<footer id="main_footer">
</footer>

<script>

  Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
    loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
  {
    loadHeader()
    loadFooter()
  })

</script>


</body>
</html>
