<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda</title>

  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/shop.css" />

  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js" defer></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js" defer></script>
</head>
<body>

<header id="main_header"></header>

<main>

  <section class="hero-banner">
    <img src="/PS-FitPlanner/Resources/image1.png" alt="Batido Izquierda" class="hero-img" />
    <div class="hero-title">
      <h1>Impulsa tu cuerpo. Transforma tu rendimiento </h1>
      <h2>Todo lo que necesitas para llevar tu entrenamiento al siguiente nivel</h2>
    </div>
    <img src="/PS-FitPlanner/Resources/image2.png" alt="Batido Derecha" class="hero-img" />
  </section>


  <div class="tarjetas-categorias">
    <div class="categoria-card" onclick="location.href='suplementos.html'">
      <button>Suplementos</button>
      <img src="/PS-FitPlanner/Resources/Suplementos.png" alt="Suplementos" />
    </div>

    <div class="categoria-card" onclick="location.href='proteina.html'">
      <button>Proteína</button>
      <img src="/PS-FitPlanner/Resources/Proteina.png" alt="Proteína" />
    </div>

    <div class="categoria-card" onclick="location.href='creatina.html'">
      <button>Creatina</button>
      <img src="/PS-FitPlanner/Resources/Creatina.png" alt="Creatina" />
    </div>

    <div class="categoria-card" onclick="location.href='recomendaciones.html'">
      <button>Recomendaciones</button>
      <img src="/PS-FitPlanner/Resources/recomendaciones.png" alt="Recomendaciones" />
    </div>
  </div>
</main>

<footer id="main_footer"></footer>

<script type="module">
  import { loadTemplate, loadHeader } from "../JavaScript/GlobalLoad/loadHeader.js";

  Promise.all([
    loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")
  ]).then(() => {
    loadHeader();
    loadFooter();
  });
</script>

</body>
</html>
