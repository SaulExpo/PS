<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>First Page</title>
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/footer.css">
    <link rel="stylesheet" href="../Styles/index.css">
  <link rel="stylesheet" href="../Styles/firs_page.css">
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
    <script type="module" src="../JavaScript/first_page.js"></script>
</head>
<body>
<header id="main_header"></header>
<main>
    <div class="first">
  <section>
    <h2 class="title">Today</h2>
      <div class="card">
    <div class="container" id="image_text">
        <div class="content">
            <img id="picture" src="../Resources/exercise.png">
            <p class="info">Dorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et velit</p>
        </div>
    </div>
      </div>
  </section>
  <section>
      <h2 class="title"><a id="calendar" href="calendar.html">Calendar</a></h2>
    <div class="card">
      <div class="container" id="image_text2">
          <div class="content">
              <img id="picture" src="../Resources/calendar.png">
              <p class="info">Dorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et velit</p>
          </div>
      </div>
    </div>
  </section>
    <section>
        <h2 class="title"><a id="ejercicios">Recommendations</a></h2>
        <div class="card">
            <div class="container" id="recomendationContainer">
                <div class="content">
                    <img src="../Resources/recommendations.png" id="picture" alt="">
                    <p class="info" id="recommendations"></p>
                </div>
            </div>
        </div>
    </section>
</div>
</main>
<footer id="main_footer"></footer>
<script type="module">
    import {loadTemplate} from "../JavaScript/GlobalLoad/loadHeader.js";
    import {load} from "../JavaScript/first_page.js";
    document.addEventListener("DOMContentLoaded", () => {
        Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
            loadTemplate("../Templates/footer.html" , "main_footer")]
        ).then(() =>
        {
            load()
        })
    });
</script>
</body>
</html>
