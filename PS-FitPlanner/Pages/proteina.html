<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proteína</title>

  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css" />
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/proteina.css" />

  <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js" defer></script>
  <script src="../JavaScript/GlobalLoad/loadFooter.js" defer></script>
  <script type="module" src="/PS-FitPlanner/JavaScript/Shop/proteina.js" defer></script>
</head>
<body>
<header id="main_header"></header>

<main>
  <section class="cabecera-proteina">
    <div class="contenedor-cabecera">
      <h1>Nuestra mejor selección de Proteínas</h1>
      <p>
        La proteína en polvo es un suplemento nutricional que concentra proteínas de alta calidad, extraídas del suero de leche o fuentes vegetales.
        Es ideal para complementar la dieta, mejorar la recuperación muscular y apoyar tus objetivos fitness.
      </p>
    </div>
  </section>


  <section class="productos-container" id="productos-container">
  </section>
</main>


<footer id="main_footer"></footer>

<script type="module">
  import { loadTemplate, loadHeader } from "../JavaScript/GlobalLoad/loadHeader.js";

  Promise.all([
    loadTemplate("../Templates/header.html", "main_header"),
    loadTemplate("../Templates/footer.html", "main_footer")
  ]).then(() => {
    loadHeader();
    loadFooter();
  });
</script>

</body>
</html>
