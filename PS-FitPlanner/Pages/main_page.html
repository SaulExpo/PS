<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Main Page</title>
    <link rel="stylesheet" href="../Styles/header.css">
    <link rel="stylesheet" href="../Styles/footer.css">
    <link rel="stylesheet" href="../Styles/login.css">
    <link rel="stylesheet" href="../Styles/main_page.css">
    <script src="../JavaScript/script.js"></script>
    <script type="module" src="../JavaScript/main_page.js"></script>
    <script type="module" src="../JavaScript/GlobalLoad/loadHeader.js"></script>
    <script src="../JavaScript/GlobalLoad/loadFooter.js"></script>
</head>
<body>

<header id="main_header"></header>

<main class="hero-section">
    <img id="imagenes" src="../Resources/portada_main.png" alt="Imagen">
    <div class="text-box">
        <p id="main-text">
            ¡Transforma tu físico en semanas!\nPlanes personalizados, motivación real\nTu cambio empieza hoy
        </p>
        <div class="main-buttons">
            <button id="Start" class="hero-btn blue" onclick="location.replace('../Pages/register.html')">Start Now</button>
            <button id="Log" class="hero-btn dark" onclick="location.replace('../Pages/login.html')">Log in</button>
        </div>
    </div>
</main>

<footer id="main_footer"></footer>

<script type="module">
    import { loadTemplate, loadHeader } from "../JavaScript/GlobalLoad/loadHeader.js";
    import { load } from "../JavaScript/main_page.js";

    Promise.all([
        loadTemplate("../Templates/footer.html", "main_footer"),
        loadTemplate("../Templates/header.html", "main_header")
    ]).then(() => {
        load();
    });
    let language = localStorage.getItem("language");
    if (language !== "english") {
        document.getElementById("Start").textContent = "Empezar  Ahora";
        document.getElementById("Log").textContent = "Iniciar Sesión";
    }
</script>

</body>
</html>
