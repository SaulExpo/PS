<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat Privado</title>
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/header.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/footer.css">
  <link rel="stylesheet" href="/PS-FitPlanner/Styles/chat.css">
  <script src="../JavaScript/loadFooter.js"></script>
  <script type="module" src="../JavaScript/loadHeader.js"></script>
  <script src="../JavaScript/getUser.js"></script>
  <script src="../JavaScript/script.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    #chatbox { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    input, select { margin: 5px 0; }
    div.me { color: blue; }
    div.them { color: green; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBJJ2p0JK-cLFgieRAGZCZmraHHmAC8OMw",
      authDomain: "prueba-de-chat-25bbe.firebaseapp.com",
      projectId: "prueba-de-chat-25bbe",
      storageBucket: "prueba-de-chat-25bbe.firebasestorage.app",
      messagingSenderId: "832208262893",
      appId: "1:832208262893:web:e4c3865d5d1093506b1ee4",
      measurementId: "G-2QYETNPHWH"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

</head>
<header id="main_header"></header>

<body>

<h2>Chat Privado</h2>

<label>Destinatario:</label><br />
<input type="text" id="recipient" placeholder="Nombre del destinatario" /><br />

<div id="chatbox"></div>

<input type="text" id="usermsg" placeholder="Escribe un mensaje..." size="50" />
<button id="send">Enviar</button>

<script>
  let socket;
  let chatHistory = {};
  let user_name;
  let unsubscribe = null;

  async function main() {
    const user = await getUserProfile();
    user_name = user.email;
    console.log("Usuario:", user_name);

    // Inicializa historial
    const saved = localStorage.getItem("chatHistory");
    if (saved) {
      chatHistory = JSON.parse(saved);
    }

    // Conecta WebSocket
    connectSocket();

    // Configura listeners
    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    document.getElementById("recipient").addEventListener("change", async () => {
      const current = document.getElementById("recipient").value.trim();
      await loadChatFromFirestore(user_name, current);
    });

    document.getElementById("send").addEventListener("click", () => {
      const msg = document.getElementById("usermsg").value.trim();
      const to = document.getElementById("recipient").value.trim();
      const time = new Date().toLocaleTimeString();

      if (!msg || !user_name || !to) {
        alert("Completa todos los campos");
        return;
      }

      addMessage("self", to, msg, time);
      socket.send(JSON.stringify({ type: "message", to, msg }));
      document.getElementById("usermsg").value = "";

      const chatId = getChatId(user_name, to);
      db.collection("chats").doc(chatId).set({ users: [user_name, to] }, { merge: true });
      db.collection("chats").doc(chatId).collection("messages").add({
        from: user_name,
        to: to,
        msg: msg,
        time: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    const currentRecipient = document.getElementById("recipient").value.trim();
    if (currentRecipient) {
      renderChat(currentRecipient);
    }
  }

  function connectSocket() {
    socket = new WebSocket("ws://localhost:3000");

    socket.addEventListener("open", () => {
      console.log("Socket conectado");
    });

    socket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);
      const time = new Date().toLocaleTimeString();

      addMessage(data.from, data.from, data.msg, time);

      const currentRecipient = document.getElementById("recipient").value.trim();
      const isVisible = document.visibilityState === "visible";

      if (data.from !== currentRecipient || !isVisible) {
        if (Notification.permission === "granted") {
          new Notification(`Nuevo mensaje de ${data.from}`, {
            body: data.msg,
            icon: "https://cdn-icons-png.flaticon.com/512/1384/1384023.png"
          });
        }
      }

      if (data.from !== user_name) {
        const chatId = getChatId(data.from, user_name);
        db.collection("chats").doc(chatId).set({ users: [data.from, user_name] }, { merge: true });
        db.collection("chats").doc(chatId).collection("messages").add({
          from: data.from,
          to: user_name,
          msg: data.msg,
          time: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    });
  }

  function addMessage(who, userKey, message, time) {
    if (!chatHistory[userKey]) chatHistory[userKey] = [];
    chatHistory[userKey].push({ from: who, msg: message, time });
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory));

    if (document.getElementById("recipient").value === userKey) {
      renderChat(userKey);
    }
  }

  function renderChat(userKey) {
    const chatbox = document.getElementById("chatbox");
    chatbox.innerHTML = "";
    (chatHistory[userKey] || []).forEach(m => {
      const who = m.from === "self" ? "Tú" : m.from;
      const className = m.from === "self" ? "me" : "them";
      chatbox.innerHTML += `<div class="${className}"><b>${who}</b> [${m.time}]: ${m.msg}</div>`;
    });
    chatbox.scrollTop = chatbox.scrollHeight;
  }

  function getChatId(user1, user2) {
    return [user1, user2].sort().join("_");
  }

  async function loadChatFromFirestore(user1, user2) {
    const chatId = getChatId(user1, user2);
    if (unsubscribe) unsubscribe();

    unsubscribe = db.collection("chats")
            .doc(chatId)
            .collection("messages")
            .orderBy("time")
            .onSnapshot(snapshot => {
              const messages = [];
              let lastVisibleMessage = chatHistory[user2]?.length || 0;

              snapshot.docs.forEach((doc, index) => {
                const data = doc.data();
                const fromSelf = data.from === user1;

                const msgObj = {
                  from: fromSelf ? "self" : data.from,
                  msg: data.msg,
                  time: data.time ? new Date(data.time.toDate()).toLocaleTimeString() : "..."
                };

                messages.push(msgObj);

                if (!fromSelf && index >= lastVisibleMessage) {
                  const isVisible = document.visibilityState === "visible";
                  const currentRecipient = document.getElementById("recipient").value.trim();

                  if (Notification.permission === "granted" && (user2 !== currentRecipient || !isVisible)) {
                    new Notification(`Nuevo mensaje de ${data.from}`, {
                      body: data.msg,
                      icon: "https://cdn-icons-png.flaticon.com/512/1384/1384023.png"
                    });
                  }
                }
              });

              chatHistory[user2] = messages;
              renderChat(user2);
            });
  }

  window.addEventListener("load", main);
</script>

<script>
  Promise.all([loadTemplate("../Templates/header.html" , "main_header"),
    loadTemplate("../Templates/footer.html" , "main_footer")]).then(() =>
  {
    loadHeader()
    loadFooter()
  })
</script>
</body>
<footer id="main_footer"></footer>

</html>
